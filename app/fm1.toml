# GABBERKIX's build settings (fm1-base's tools/build.py, through ./build.sh)
name = "GABBERKIX"             # APP_NAME is in app.h; this names the build's files: gabberkix.fwsc, gabberkix-X.Y.fwsc
id_prefix = "FM-1_818"         # package identity: dev FM-1_81800, releases FM-1_818XXYYZZ. NOT YET CHECKED against
                               # the hub's catalogue (catalog.json): check and claim it before any release
usb_manufacturer = "GABBERKIX"
usb_product = "GABBERKIX FM-1"
include = ["kick", "clock"]
o2 = ["kick/*.c", "clock/*.c"]   # the kick engine and the clock follower, at -O2
words = "words.tsv"
ble = true                     # Bluetooth MIDI
ble_stack = "own"              # fm1-base's own stack: nothing of JieLi's linked (the licence stays GPL-3.0)
ble_central = true             # and to Bluetooth MIDI devices (another FM-1): the connections page (SEL + REC)
ble_midi_time = true           # Bluetooth MIDI by the sender's time: a clock over Bluetooth without its bunching
backup = true                  # the presets backed up and restored over USB; the render page reads them (web/render)
backup_ext = "gkbk"
backup_holds = "the sixteen presets"
usb_host = true                # the USB port hosts a MIDI device (another FM-1) when asked: the connections page
# the site (tools/make_site.py)
tagline = "A hardcore kick designer for the FM-1"
repo = "https://github.com/ejtb76/gabberkix"
licence = "GPL-3.0-only"
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
# firmware.json, for firmware hubs (fm1-base's docs/FIRMWARE-JSON.md): the build writes it from these and the keys above
author = "Presethead"
description = "GABBERKIX turns the M-VAVE FM-1 into a hardcore kick designer: a synthesized 909 shaped by layered filters, distortion and clippers, played on every beat or pitched from the keys and MIDI."
tags = ["drum-machine", "synth"]
